<script>
(() => {
"use strict";

// ---------- справочники ----------
const SEG = {
  sell_side: { label: "Продавцы", full: "Продавцы, владельцы", share: 0.35 },
  buy_side: { label: "Инвесторы", full: "Покупатели, инвесторы", share: 0.35 },
  ecosystem: { label: "Экосистема", full: "Экосистема и источники сделок", share: 0.30 },
};
const POST_STATUS = {
  draft: ["Черновик", "warn"], ready: ["Ждёт решения", "warn"], needs_fix: ["Нужна правка", "bad"],
  approved: ["Одобрен", "good"], published: ["Опубликован", "good"],
};
const HERO_STATUS = { candidate: ["Кандидат", ""], researched: ["Исследован", "good"], rejected: ["Отклонён", "bad"], need_more_data: ["Мало фактов", "warn"] };
const SCORE_LABELS = { fit: "Попадание в цель", fresh: "Свежий повод", unique: "Уникальность", reader_value: "Польза читателю", reaction: "Реакция героя", topic_link: "Связь с темами" };
const KEYWORDS = ["luxury hotel","ultra-luxury","hospitality investment","hotel transaction","hotel m&a","отел","инвестиции в отели","продажа отеля","family office","private equity","branded residences","revpar","adr","cap rate","resort","boutique hotel","design hotel","real estate"];
const BANNED = ["in today's world","it's no secret","plays a key role","unique opportunity","worth noting","it's important to understand","let's dive","deep dive","dive into","in conclusion","innovative","game-changer","game changer","synergy","next level","inspiring","true professionals","dream team","hi everyone","today i want to share","genius","incredible","the best","в современном мире","не секрет","играет ключевую роль","уникальная возможность","стоит отметить","важно понимать","в заключение","давайте разберёмся","давайте разберемся","погрузимся","инновационн","эффективные решения","новый уровень","синерги","вдохновляет","настоящие профессионалы","команда мечты","друзья, всем привет","сегодня хочу рассказать","гениальн","невероятн","лучший","лучшая","лучшее"];
const FORBIDDEN_STARTS = ["today i want to share","hi everyone","hello everyone","in today's world","it's no secret","сегодня хочу рассказать","друзья","в современном мире","не секрет"];
const TASK_TYPES = { goal_people: "Найти людей под цель", scout: "Найти новых героев", research: "Исследовать героя", deepen: "Дособрать факты", other: "Другое" };

const AUTHOR_RULES = `You write LinkedIn posts IN ENGLISH on behalf of Zaira, an expert in buying and selling luxury and ultra-luxury hotels with a unique concept and strong design. You are not a copywriter and not an AI: you are a practitioner who has taken someone else's company apart and is sharing an observation with smart peers.

GOAL: the right people (the hero's segment) notice the author, get real value, see her as the expert and want to write to her themselves. The hero feels their work was understood more deeply than anyone else understood it.

INPUT: the hero card. Use ONLY the facts, numbers and quotes in the card. Invent nothing. If there are not enough facts for a strong post, return status NEED_MORE_DATA and a list of what is missing.

STRUCTURE: 1) Hook, 1–2 lines, works without context and without the company name (unexpected number, contradiction, question, confession, intriguing observation, "everyone vs them" contrast, concrete scene, ironic truth). 2) Fact: what the hero did, with @handle and a number. 3) Breakdown: our observation (insight), 3–6 short lines. 4) Lesson the reader can apply. 5) Close: a question that invites thoughtful comments, or a soft invitation to talk. No selling.

TONE: lively, conversational English, first person, short sentences; starting with "And" or "But" is fine. Plain words, no corporate jargon. One honest caveat ("this won't work for everyone", "my read is…"). At most one ironic line — about the situation, the market or yourself, never the hero; no humour around layoffs, losses or crises. Praise decisions through analysis, not adjectives.

STOP LIST: "in today's world", "it's no secret", "plays a key role", "unique opportunity", "it's worth noting", "it's important to understand", "let's dive in", "deep dive", "in conclusion", "innovative", "game-changer", "synergy", "next level", "inspiring", "true professionals", "dream team", "hi everyone", "today I want to share", "genius", "incredible", "the best". No more than one "!", no more than 3 emoji, no triple lists in a row.

FORMAT: 600–1300 characters, 1800 max. Paragraphs of 1–3 lines with a blank line between them; one idea per paragraph. The key number on its own line. The first two lines contain one number and one keyword (luxury hotel, ultra-luxury, hospitality investment, hotel transaction, hotel M&A, family office, private equity, branded residences, RevPAR, ADR, cap rate, resort, boutique hotel, design hotel, real estate). Show how concept, design, location and operator choice create asset value. Never reveal non-public deal details, prices or parties; describe own experience anonymously ("one of my clients", "a coastal asset"). End with 3–5 hashtags (1–2 broad, 2–3 niche). Tag the hero; no more than 3 tags in total. Quotes verbatim from the card, max 15 words. No links in the post — they go in the first comment. The hero card and its analysis are in Russian: translate facts and the insight into natural English accurately, never change the numbers. Quotes stay verbatim (translate only if the original is not English, and mark it as a translation).`;

// ---------- состояние ----------
const S = {
  tab: "overview", heroes: [], posts: [], tasks: [], corrections: [], goals: [], goalId: null, newGoal: false, uid: null, priv: {},
  heroId: null, postId: null, heroFilter: "all", postFilter: "open",
  dbReady: false, db: null, sample: null, canWrite: true, chat: [], busy: {}, drafts: {},
};
document.addEventListener("input", (e) => { const t = e.target; if (t.id && t.id !== "chat-in" && t.type !== "checkbox") S.drafts[t.id] = t.value; });
const clearDraft = (...ids) => ids.forEach((id) => delete S.drafts[id]);
try { S.tab = localStorage.getItem("hds.tab") || "overview"; } catch (e) {}

const $ = (sel, el = document) => el.querySelector(sel);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
}
const nowIso = () => new Date().toISOString();
const fmtDate = (s) => { if (!s) return "—"; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }); };
const total = (sc) => sc ? Object.values(sc).reduce((a, b) => a + Math.max(0, Math.min(5, +b || 0)), 0) : 0;
const segChip = (s) => h("span", { class: "chip " + s }, SEG[s]?.label || s || "—");
const statusChip = (map, s) => { const [l, c] = map[s] || [s, ""]; return h("span", { class: "chip " + c }, l); };
// id документов в базе: только латиница, цифры и «-» — кириллицу транслитерируем
const TRANSLIT = { а: "a", б: "b", в: "v", г: "g", д: "d", е: "e", ё: "e", ж: "zh", з: "z", и: "i", й: "y", к: "k", л: "l", м: "m", н: "n", о: "o", п: "p", р: "r", с: "s", т: "t", у: "u", ф: "f", х: "h", ц: "ts", ч: "ch", ш: "sh", щ: "sch", ъ: "", ы: "y", ь: "", э: "e", ю: "yu", я: "ya" };
const slug = (t) => (t || "x").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[а-яё]/g, (c) => TRANSLIT[c] ?? "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50) || "x";
const sampleErr = (e) => ({
  not_granted: "Доступ к Claude не разрешён для этой страницы.",
  rate_limited: "Слишком много запросов подряд. Подождите минуту.",
  cancelled: "Остановлено.",
}[e?.code] || "Claude не ответил: " + (e?.message || "ошибка"));

// ---------- проверки редактора (как в checks.py) ----------
const TAG_BANNED = ["amazing", "incredible", "outstanding", "excited to share", "in today's dynamic market", "in today's world", "game-changer", "game changer", "halfway through", "contact me", "dm me", "i represent", "it's no secret", "synergy", "next level", "deep dive", "по данным сми", "according to media", "reportedly"];
function checkTagPost(text) {
  const errors = [], warnings = [], ok = [];
  const body = (text || "").trim(), low = body.toLowerCase(), n = body.length;
  const isList = /(^|\n)\s*(\*\*)?\s*(\d+[.)]|[1-9]\uFE0F?\u20E3|→)/.test(body);
  if (n > 2000) errors.push(`Длина ${n} знаков, максимум 2 000`);
  else if (n > 1300 && !isList) warnings.push(`Длина ${n} — для короткого поста до 1 300`);
  else ok.push(`Длина ${n} знаков`);
  const first = (body.split("\n")[0] || "").trim();
  if (!/^\*\*.+\*\*$/.test(first)) warnings.push("Хук не выделен жирным (**…**)");
  const hookWords = first.replace(/\*/g, "").split(/\s+/).filter(Boolean).length;
  hookWords > 10 ? warnings.push(`Хук ${hookWords} слов, лучше до 10`) : ok.push("Хук короткий");
  const banned = TAG_BANNED.filter((w) => low.includes(w));
  banned.length ? errors.push("Запрещено гайдлайном: " + banned.join(", ")) : ok.push("Без штампов и прямой продажи");
  const mentions = body.match(/(^|[^\w@])@[\p{L}\p{N}][\p{L}\p{N}&.'’-]*/gu) || [];
  if (!mentions.length) errors.push("Нет @отметок компаний и людей");
  else if (mentions.length > 10) errors.push(`Отметок: ${mentions.length} — не больше 3–4 компаний и 5–6 людей`);
  else ok.push(`Отметок: ${mentions.length}`);
  if (/https?:\/\/|www\./.test(body)) errors.push("Ссылка в тексте — только в первый комментарий");
  if ((body.match(/!/g) || []).length > 1) errors.push("Больше одного «!»");
  const emo = (body.match(/\p{Extended_Pictographic}/gu) || []).length; if (emo > 0) warnings.push("Эмодзи — только цифры-эмодзи в аналитике");
  return { errors, warnings, ok, passed: errors.length === 0 };
}
function checkPost(text, handle, hero, style) {
  if (style === "tags") return checkTagPost(text);
  const errors = [], warnings = [], ok = [];
  const body = (text || "").trim(), low = body.toLowerCase();
  const n = body.length;
  if (n < 600 || n > 1800) errors.push(`Длина ${n} знаков, нужно 600–1800`);
  else if (n > 1300) warnings.push(`Длина ${n} — выше оптимума 1300`); else ok.push(`Длина ${n} знаков`);
  const paras = body.split(/\n\s*\n/).filter((p) => p.trim());
  const longP = paras.filter((p) => !/^(\s*#[\p{L}\p{N}_-]+\s*)+$/u.test(p) && (p.split("\n").filter((l) => l.trim()).length > 3 || p.length > 320));
  longP.length ? errors.push(`Длинных абзацев: ${longP.length}`) : ok.push("Абзацы короткие");
  const banned = BANNED.filter((w) => low.includes(w));
  banned.length ? errors.push("Стоп-лист: " + banned.join(", ")) : ok.push("Без слов из стоп-листа");
  const first = (body.split("\n")[0] || "").toLowerCase();
  if (FORBIDDEN_STARTS.some((s) => first.startsWith(s))) errors.push("Хук начинается с запрещённой фразы");
  const head = body.split("\n").slice(0, 2).join(" ").toLowerCase();
  /\d/.test(head) ? ok.push("Цифра в первых строках") : errors.push("В первых двух строках нет цифры");
  if (!KEYWORDS.some((k) => head.includes(k))) warnings.push("В первых строках нет ключевого слова");
  const ex = (body.match(/!/g) || []).length; if (ex > 1) errors.push(`«!»: ${ex}, максимум 1`);
  const emo = (body.match(/\p{Extended_Pictographic}/gu) || []).length; if (emo > 3) errors.push(`Эмодзи: ${emo}, максимум 3`);
  const mentions = body.match(/(^|[^\w@])@[\p{L}\p{N}_.-]+/gu) || [];
  if (mentions.length > 3) errors.push(`Отметок: ${mentions.length}, максимум 3`);
  const hd = (handle || "").trim();
  if (hd.startsWith("@")) (low.includes(hd.toLowerCase()) ? ok.push("Герой отмечен") : errors.push(`Герой не отмечен (${hd})`));
  else if (hero && !low.includes(hero.split(" ")[0].toLowerCase())) errors.push("Герой не упомянут");
  else warnings.push("Отметьте героя вручную при публикации");
  const tags = body.match(/(^|\s)#[\p{L}\p{N}_-]+/gu) || [];
  (tags.length >= 3 && tags.length <= 5) ? ok.push(`Хэштегов: ${tags.length}`) : errors.push(`Хэштегов: ${tags.length}, нужно 3–5`);
  if (/https?:\/\/|www\./.test(body)) errors.push("Ссылка в тексте — перенесите в первый комментарий");
  const tail = body.split("\n").filter((l) => l.trim() && !l.trim().startsWith("#")).join("\n").slice(-300).toLowerCase();
  (tail.includes("?") || tail.includes("пишите") || tail.includes("в личк") || /\b(dm|message me|drop me|reach out|let's talk)\b/.test(tail)) ? ok.push("Есть финальный вопрос") : warnings.push("Нет финального вопроса");
  return { errors, warnings, ok, passed: errors.length === 0 };
}

// ---------- данные ----------
async function save(path, data, merge = true) {
  if (!S.db) { toast("Хранилище недоступно в этом просмотре"); throw new Error("no db"); }
  try {
    const ref = S.db.doc(path);
    if (merge) {
      const snap = await ref.get();
      await ref.set({ ...(snap.exists ? snap.data() : {}), ...data });
    } else await ref.set(data);
  } catch (e) {
    if (e?.code === "invalid_argument") { S.canWrite = false; render(); toast("Не сохранилось: нет прав или неверные данные"); }
    else if (e?.code === "quota_exceeded") toast("Хранилище заполнено: удалите старые записи");
    else toast("Не сохранилось: " + (e?.message || e));
    throw e;
  }
}
// Личное хранилище: видно только вам (data/users/<ваш id>), даже если дашборд открыт по ссылке
const privKey = (kind, id) => kind + "-" + id;
const privGet = (kind, id) => S.priv[privKey(kind, id)]?.text || "";
async function privSet(kind, id, text) {
  if (!S.uid) { toast("Личное хранилище недоступно: войдите в Claude"); throw new Error("no uid"); }
  await S.db.collection("data/users/" + S.uid).doc(privKey(kind, id)).set({ text, updated: nowIso() });
}
async function remove(path) { try { await S.db.doc(path).delete(); } catch (e) { toast("Не удалилось: " + (e?.message || e)); } }

function subscribe() {
  const sub = (name, key, sortFn) => S.db.collection(name).onSnapshot(
    (snap) => { S[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort(sortFn); S.dbReady = true; render(); },
    (e) => { if (e?.code === "revoked") { S.db = null; render(); } }
  );
  sub("heroes", "heroes", (a, b) => (b.total ?? total(b.scores)) - (a.total ?? total(a.scores)));
  sub("posts", "posts", (a, b) => String(b.created || "").localeCompare(String(a.created || "")));
  sub("goals", "goals", (a, b) => (a.status === "done") - (b.status === "done") || String(b.created || "").localeCompare(String(a.created || "")));
  sub("tasks", "tasks", (a, b) => String(b.created || "").localeCompare(String(a.created || "")));
  if (S.uid) S.db.collection("data/users/" + S.uid).onSnapshot((snap) => { S.priv = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()])); render(); }, () => {});
  S.db.doc("settings/guidelines").onSnapshot((d) => { S.corrections = d.exists ? (d.data().corrections || []) : []; render(); });
}

function barChart(items) {

    ${items.map((it, i) => `<text x="${pad - 8}" y="${i * rowH + 17}" text-anchor="end">${esc(it.label.length > 22 ? it.label.slice(0, 21) + "…" : it.label)}</text>
      <rect x="${pad}" y="${i * rowH + 6}" width="${Math.max(2, scale(it.value) - pad)}" height="14" rx="3" fill="var(--accent)"/>
      <text x="${scale(it.value) + 6}" y="${i * rowH + 17}" style="fill:var(--ink)">${it.value}</text>`).join("")}

}

  if (!S.copied) return null;
  const ta = h("textarea", { class: "short", readonly: true, "aria-label": "Команда для чата Claude" }); ta.value = S.copied;
  ta.addEventListener("focus", () => ta.select());
  return h("div", { class: "panel", style: "background:var(--accent-soft);grid-column:1/-1" },
    h("strong", {}, "Команда для агента"),
    h("p", { class: "note", style: "margin:0" }, "Вставьте её в чат Claude Code (сессия «Агент для этого»). Агент найдёт информацию и запишет результаты сюда — страница обновится сама."),
    ta, h("div", { class: "actions" }, h("button", { class: "btn", onclick: () => copy(S.copied) }, "Скопировать ещё раз"), h("button", { class: "btn ghost", onclick: () => { S.copied = null; render(); } }, "Скрыть")));
}

async function queueTask(type, text, extra = {}, silent) {
  const id = new Date().toISOString().replace(/[:.]/g, "-") + "_" + Math.random().toString(36).slice(2, 5);
  const task = { type, text, status: "queued", created: nowIso(), ...extra };
  await save("tasks/" + id, task, false);
  if (!silent) toast("Задача поставлена — нажмите «Запустить»");
  return { id, ...task };
}
async function queueAndRun(type, text, extra = {}) {
  const dup = S.tasks.find((t) => t.status === "queued" && t.type === type && t.text === text);
  const task = dup || await queueTask(type, text, extra, true);
  runTasks([task]);
}
function vAgent(root) {
  const g = h("div", { class: "grid2" });
  // чат
  const chatBox = h("div", { class: "chat", id: "chatlog" });
  if (!S.chat.length) chatBox.append(h("div", { class: "msg sys" }, "Спросите что угодно о героях, постах и метриках. Агент может поставить задачу на поиск, добавить корректировку или подготовить пост."));
  for (const m of S.chat) chatBox.append(h("div", { class: "msg " + m.role }, m.content || h("span", { class: "thinking" }, "Думаю…")));
  const inp = h("textarea", { id: "chat-in", placeholder: S.sample ? "Например: кого из инвесторов взять следующим?" : "Чат работает при открытии в Claude", disabled: !S.sample || S.busy.chat });
  inp.value = S.chatDraft || "";
  inp.addEventListener("input", () => (S.chatDraft = inp.value));
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } });
  const sugg = ["Кого из героев взять следующим и почему?", "Какой сегмент недобран в этом месяце?", "Найди 5 новых героев: family offices, купившие отели в горах", "Сделай хук для последнего поста сильнее"];
  g.append(h("section", { class: "panel" },
    h("div", { class: "panel-head" }, h("h2", {}, "Разговор с агентом"), S.chat.length ? h("button", { class: "btn ghost", onclick: () => { S.chat = []; render(); } }, "Очистить") : null),
    chatBox,
    h("div", { class: "suggest" }, sugg.map((s) => h("button", { class: "fbtn", disabled: !S.sample || S.busy.chat, onclick: () => { S.chatDraft = s; sendChat(); } }, s))),
    h("div", { class: "composer" }, inp, S.busy.chat ? h("button", { class: "btn", onclick: () => S.chatCtl?.abort() }, "Стоп") : h("button", { class: "btn primary", disabled: !S.sample, onclick: sendChat }, "Отправить"))));
  requestAnimationFrame(() => { const c = $("#chatlog"); if (c) c.scrollTop = c.scrollHeight; });

  // задачи
  const right = h("div", { class: "view" });
  const tsel = h("select", { id: "task-type" }, Object.entries(TASK_TYPES).map(([k, l]) => h("option", { value: k }, l)));
  const ttext = h("textarea", { id: "task-text", class: "short", placeholder: "Например: найти 5 героев из экосистемы — архитекторов люксовых отелей с проектами за последние 60 дней" });
  const queued = S.tasks.filter((t) => ["queued", "running"].includes(t.status)), done = S.tasks.filter((t) => !["queued", "running"].includes(t.status));
  right.append(h("section", { class: "panel" },
    h("h2", {}, "Задачи на поиск в интернете"),
    h("p", { class: "note", style: "margin:0" }, "Поиск в интернете выполняет агент в чате Claude Code. «Запустить» копирует команду — вставьте её в чат, результаты появятся здесь и в карточках героев."),
    h("label", { class: "f", for: "task-type" }, "Тип"), tsel,
    h("label", { class: "f", for: "task-text" }, "Что сделать"), ttext,
    h("div", { class: "actions" }, h("button", { class: "btn primary", disabled: !S.canWrite || !S.db, onclick: () => { const t = ttext.value.trim() || TASK_TYPES[tsel.value]; queueTask(tsel.value, t).then(() => clearDraft("task-text")); ttext.value = ""; } }, "Поставить задачу")),
    queued.length ? h("div", {}, h("div", { class: "actions" }, runAllBtn(queued)), queued.map(taskRow)) : h("p", { class: "note" }, "Очередь пуста."),
    done.length ? h("details", {}, h("summary", { class: "note" }, `Выполненные (${done.length})`), done.slice(0, 20).map(taskRow)) : null));

  // корректировки
  const cin = h("textarea", { id: "corr-in", class: "short", placeholder: "Например: не использовать слово «актив» чаще двух раз; писать от женского лица; больше цифр ADR" });
  right.append(h("section", { class: "panel" },
    h("h2", {}, "Постоянные корректировки"),
    h("p", { class: "note", style: "margin:0" }, "Правила, которые агент применяет к каждому новому посту — и на странице, и в чате."),
    S.corrections.length ? h("div", {}, S.corrections.map((c, i) => h("div", { class: "corr" }, h("span", {}, c.text), h("button", { class: "btn ghost danger", disabled: !S.canWrite, onclick: () => save("settings/guidelines", { corrections: S.corrections.filter((_, j) => j !== i) }, false) }, "Убрать")))) : h("p", { class: "note" }, "Пока нет корректировок."),
    h("label", { class: "f", for: "corr-in" }, "Новое правило"), cin,
    h("div", { class: "actions" }, h("button", { class: "btn", disabled: !S.canWrite || !S.db, onclick: () => { const t = cin.value.trim(); if (t) addCorrection(t).then(() => { clearDraft("corr-in"); toast("Правило добавлено"); }); } }, "Добавить правило"))));
  g.append(right);
  root.append(g);
}
function askAbout(q) { S.chatDraft = q; go("agent"); sendChat(); }

function dataSummary() {
  return JSON.stringify({
    today: new Date().toISOString().slice(0, 10),
    heroes: S.heroes.map((x) => ({ id: x.id, hero: x.hero, company: x.company, segment: x.segment, status: x.status, score: x.total ?? total(x.scores), occasion: x.occasion, lens: x.lens, insight: x.insight, facts: (x.facts || []).length })),
    posts: S.posts.map((p) => ({ id: p.id, hero: p.hero, segment: p.segment, status: p.status, hook: p.hook_type, created: p.created, first_line: (p.final_text || p.variant_a || "").split("\n")[0], metrics: p.metrics || null })),
    goals: S.goals.map((g) => ({ id: g.id, title: g.title, description: g.description, status: g.status, audience: (g.plan?.audience || []).map((a) => a.type), angles: (g.plan?.post_angles || []).map((a) => a.angle), people: S.heroes.filter((x) => (x.goalIds || []).includes(g.id)).map((x) => x.id), posts: S.posts.filter((p) => p.goalId === g.id).length })),
    queued_tasks: S.tasks.filter((t) => t.status === "queued").map((t) => t.text),
    corrections: S.corrections.map((c) => c.text),
  });
}
const CHAT_RULES = `Ты агент контент-конвейера Заиры — эксперта по сделкам с люксовыми и ультра-люксовыми отелями. Конвейер: разведчик (ищет героев, скоринг 0–5 по 6 критериям, берём от 20/30), исследователь (факты со ссылками), аналитик (линза и инсайт, тест на уникальность), автор (2 варианта поста), редактор (проверки), человек (одобряет). Баланс в месяц: 35% продающая сторона, 35% покупающая, 30% экосистема. Одного героя не чаще раза в 3 месяца. Ритм 3–4 поста в неделю. Главная метрика — входящие сообщения.

Отвечай по-русски, коротко и по делу (анализ героев — на русском, посты — всегда на английском: если предлагаешь хук или текст поста, пиши его на английском), опираясь на данные дашборда ниже. Ты НЕ можешь искать в интернете: если нужен поиск или исследование — вызови инструмент queue_task и скажи, что задача поставлена и её можно запустить кнопкой «Запустить» во вкладке «Агент». Если пользователь даёт правило для всех будущих постов — вызови add_correction. Если пользователь описывает бизнес-задачу («найти покупателей на…», «выйти на операторов…») — создай цель через create_goal. Если он хочет только посты без поиска людей — mode "posts"; иначе mode "full" и затем задача goal_people с её goalId. Если просит написать пост о герое — вызови write_post. Не выдумывай факты о героях.`;
async function sendChat() {
  const text = (S.chatDraft || "").trim();
  if (!text || !S.sample || S.busy.chat) return;
  S.chatDraft = ""; S.chat.push({ role: "me", content: text }); const ai = { role: "ai", content: "" }; S.chat.push(ai);
  S.busy.chat = true; S.chatCtl = new AbortController(); render();
  const turns = [{ role: "user", content: CHAT_RULES + "\n\nДАННЫЕ ДАШБОРДА:\n" + dataSummary() }, { role: "assistant", content: "Понял, данные и правила у меня. Слушаю." }];
  for (const m of S.chat.slice(0, -1)) if (m.role === "me" || (m.role === "ai" && m.content)) turns.push({ role: m.role === "me" ? "user" : "assistant", content: m.content });
  const tools = [
    { name: "queue_task", description: "Поставить задачу на поиск/исследование в интернете (выполнит Claude в чате).", inputSchema: { type: "object", properties: { type: { type: "string", enum: Object.keys(TASK_TYPES) }, text: { type: "string" }, heroId: { type: "string" }, goalId: { type: "string" } }, required: ["type", "text"] },
      execute: async (i) => { await queueTask(i.type, i.text, Object.fromEntries([["heroId", i.heroId], ["goalId", i.goalId]].filter(([, v]) => v)), true); return { ok: true }; } },
    { name: "create_goal", description: "Создать новую цель (бизнес-задачу), под которую агент ищет людей и пишет посты. Детали конкретного актива — в asset, они не попадают в посты.", inputSchema: { type: "object", properties: { title: { type: "string" }, description: { type: "string" }, asset: { type: "string" }, mode: { type: "string", enum: ["full", "posts"], description: "full — план с поиском людей; posts — только серия постов под цель без поиска людей" } }, required: ["title", "description"] },
      execute: async (i) => { const id = await createGoal(i.title, i.description, i.asset || "", i.mode || "full"); return { id }; } },
    { name: "add_correction", description: "Добавить постоянное правило для всех будущих постов.", inputSchema: { type: "object", properties: { text: { type: "string" } }, required: ["text"] },
      execute: async (i) => { await addCorrection(i.text); return { ok: true }; } },
    { name: "write_post", description: "Написать 2 варианта поста о герое по его карточке (id героя из данных), при необходимости под цель и угол.", inputSchema: { type: "object", properties: { heroId: { type: "string" }, goalId: { type: "string" }, angle: { type: "string" } }, required: ["heroId"] },
      execute: async (i) => { const x = S.heroes.find((y) => y.id === i.heroId); if (!x) throw new Error("Нет такого героя"); if (!(x.facts || []).length) throw new Error("У героя нет фактов — сначала исследование"); writePost(x, i.goalId || null, i.angle || ""); return { started: true }; } },
    { name: "get_hero", description: "Полная карточка героя: факты, цитаты, анализ.", inputSchema: { type: "object", properties: { heroId: { type: "string" } }, required: ["heroId"] },
      execute: async (i) => cardFor(S.heroes.find((y) => y.id === i.heroId) || {}) },
  ];
  try {
    const { text: answer } = await S.sample(turns, { tools, cache: false, signal: S.chatCtl.signal, onText: ({ text }) => { ai.content = text; const log = $("#chatlog"); if (log?.lastChild) { log.lastChild.textContent = text; log.scrollTop = log.scrollHeight; } } });
    ai.content = answer;
  } catch (e) {
    ai.content = e?.text || ""; S.chat.push({ role: "sys", content: sampleErr(e) });
  } finally { S.busy.chat = false; if (!ai.content) S.chat.splice(S.chat.indexOf(ai), 1); render(); }
}

// ---------- старт ----------
render();
(async () => {
  const c = window.claude;
  if (!c?.use) { S.dbChecked = S.sampleChecked = true; render(); return; }
  const [db, sample, user] = await Promise.all([c.use("db"), c.use("sample"), c.use("user")]);
  S.db = db; S.sample = sample; S.dbChecked = S.sampleChecked = true;
  if (user?.id) { try { S.uid = await user.id(); } catch (e) {} }
  if (user?.can) { try { const w = await user.can("data.write"); if (w === false) S.canWrite = false; } catch (e) {} }
  if (db) subscribe();
  render();
})();
})();
</script>
