# Профиль автора и правила системы. Обновлять раз в квартал (портреты, темы, стоп-лист).
author:
  name: "Zaira"            # подставляется в промпт агента-автора вместо [ИМЯ]
  niche: >-
    Покупка и продажа отелей с фокусом на люксовые и ультра-люксовые активы,
    уникальные концепции и сильный дизайн.
  goal: >-
    Владельцы, инвесторы и их окружение видят во мне человека, который глубже всех
    понимает ценность люксового отельного актива, и сами пишут обсудить продажу,
    покупку, оценку или партнёрство.

# Сегменты аудитории и целевой баланс постов в месяц
segments:
  sell_side:
    label: "Продавцы, владельцы"
    share: 0.35
    who: >-
      Частные владельцы и семьи-владельцы отелей, девелоперы и development platforms,
      asset management компании, фонды, держащие отели в управлении
    wants: "Что я понимаю уникальность их актива и умею донести её до покупателя по правильной цене"
    final: "Вопрос о похожей задаче у читателей"
  buy_side:
    label: "Покупатели, инвесторы"
    share: 0.35
    who: >-
      Family offices, PE-фонды, суверенные и государственные фонды, пенсионные и страховые
      фонды, REIT, hospitality-фонды, UHNW-инвесторы, строительные и инвестиционные холдинги
    wants: "Доступ к редким активам, понимание рынка, цифр и рисков, умение найти off-market возможности"
    final: "Вопрос о похожей задаче у читателей"
  ecosystem:
    label: "Экосистема и источники сделок"
    share: 0.30
    who: >-
      Бренды-операторы и управляющие компании, архитекторы и дизайн-бюро интерьеров,
      банки и debt-фонды, консультанты и оценщики, юристы по сделкам, девелоперы branded
      residences, собственники земли и исторических зданий под конверсию
    wants: "Что я партнёр, который понимает их работу и может привести клиентов или проекты"
    final: "Приглашение к обмену опытом или вопрос к герою"

topics:
  - Сделки и оценка люксовых отелей
  - Ценность концепции и дизайна в цене актива
  - Брендированные vs независимые отели
  - Управленческие договоры и выбор оператора
  - Branded residences
  - Конверсия исторических зданий
  - Off-market сделки
  - Стратегии family offices и фондов в hospitality
  - "Рынки и направления: Европа, Ближний Восток, острова, горы, винные регионы"
  - Выход из актива и время продажи

keywords:
  - luxury hotel
  - ultra-luxury
  - hospitality investment
  - hotel transaction
  - hotel M&A
  - отели
  - инвестиции в отели
  - продажа отеля
  - family office
  - private equity
  - branded residences
  - RevPAR
  - ADR
  - cap rate
  - resort
  - boutique hotel
  - design hotel
  - real estate

sources:
  - "Отраслевые медиа и аналитика по hospitality: новости сделок, открытий, ребрендингов, назначений"
  - "Отчёты брокеров и консультантов по отельным инвестициям и годовые обзоры рынка"
  - "Отраслевые конференции по hotel investment: спикеры, выступления, интервью"
  - "Пресс-релизы брендов-операторов о новых подписанных проектах (pipeline)"
  - "Архитектурные и дизайн-медиа: премии, новые проекты отелей"
  - "Сайты и LinkedIn фондов, family offices, asset managers: портфели, назначения, сделки"
  - "Подключённая база контактов (Apollo): ЛПР Head of Hospitality, Investment Director, Asset Manager, CIO, Founder"
  - "Мои созвоны и встречи (data/call_notes/)"

niche_lenses:
  - "Концепция как стоимость: как идея, история места или дизайн создают премию к цене номера и стоимости актива"
  - "Редкость локации: почему такой актив невозможно повторить"
  - "Выбор оператора: почему этот бренд, этот тип договора или решение остаться независимыми"
  - "Архитектура и дизайн: что в проекте работает на гостя и на доходность одновременно"
  - "Стратегия инвестора: что покупка говорит о тезисе фонда или family office"
  - "Тайминг: почему продали или купили именно сейчас"
  - "Конверсия: как старое здание или участок превратились в люксовый продукт"
  - "Резиденции и смешанное использование: как branded residences финансируют проект"

hook_examples:
  - "Отель на 40 номеров стоит дороже соседнего на 200. И дело не в локации."
  - "Этот family office уже третий раз покупает отель в горах. Я, кажется, понял их тезис."
  - "Архитектор убрал из проекта лобби. Владелец сначала был в ужасе, теперь это главная фишка отеля."
  - "Все бренды хотели этот актив. Владелец выбрал остаться независимым. Посчитала, почему это было правильно."
  - "Самая дорогая деталь этого отеля не в номерах, а в том, чего гость никогда не увидит."
  - "Инвесторы спрашивают меня о доходности. Покупают в итоге историю. Вот пример."

# Стоп-лист героев и тем: конкуренты, токсичные темы, компании, о которых не пишем
stoplist:
  companies: []
  topics:
    - активы, которые сейчас продаются через меня (без согласия владельца)
    - увольнения, банкротства, судебные споры героев

rules:
  min_score: 20              # из 30
  hero_cooldown_days: 90     # одного героя не чаще раза в 3 месяца
  fresh_news_days: 60
  posts_per_week: [3, 4]
  max_research_loops: 2      # банальный инсайт -> обратно на исследование
  max_rewrite_loops: 2       # ошибка редактора -> обратно автору
